<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cahier">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Cahier — Anglais</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{
    --paper: #FBF8F1;
    --paper-edge: #F2EDDF;
    --line-blue: #9FB8DC;
    --line-blue-soft: #C7D6EC;
    --margin-red: #C4544A;
    --ink: #223146;
    --ink-soft: #4A5A72;
    --pen-red: #B23A32;
    --pen-red-soft: #D98D86;
    --pen-green: #4C7A5E;
    --tab-1: #C4544A;
    --tab-2: #4C7A5E;
    --tab-3: #4A6FA5;
    --tab-4: #B8863B;
    --tab-5: #3F8F86;
    --tab-6: #7A5C8E;
    --tab-7: #A54B70;
    --shadow: 0 2px 3px rgba(34,49,70,0.06), 0 8px 24px rgba(34,49,70,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:Georgia, 'Times New Roman', serif;
    color:var(--ink);
    background:
      linear-gradient(var(--paper-edge) 0 100%);
    min-height:100%;
    overscroll-behavior:none;
  }
  .grid-bg{
    position:fixed; inset:0; z-index:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--line-blue-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-blue-soft) 1px, transparent 1px);
    background-size: 100% 28px, 28px 100%;
    background-position: 0 64px, 0 0;
  }
  .margin-line{
    position:fixed; top:0; bottom:0; left:44px; width:2px;
    background:var(--margin-red); opacity:0.55; z-index:0;
  }
  @media (min-width:520px){ .margin-line{ left:64px; } }

  .app{
    position:relative; z-index:1;
    max-width:560px; margin:0 auto;
    padding: 18px 18px 90px 18px;
    min-height:100vh;
  }
  @media (min-width:520px){ .app{ padding-left:76px; } }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 8px 4px 14px 4px;
  }
  h1.brand{
    font-family:Snell Roundhand, 'Bradley Hand', 'Segoe Script', cursive;
    font-size:2.4rem; font-weight:700; color:var(--ink);
    margin:0; line-height:1;
    transform: rotate(-1deg);
  }
  .streak{
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive;
    font-size:0.95rem; color:var(--pen-red);
    white-space:nowrap;
  }

  /* Tabs like notebook divider tabs — grid so all themes are visible, no hidden scroll */
  .tabs{ display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin: 6px 0 14px 0; }
  .tab{
    text-align:center;
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-weight:700; font-size:0.78rem;
    padding:10px 6px 9px 6px;
    border-radius:10px 10px 3px 3px;
    color:#fff; cursor:pointer; border:none;
    box-shadow: var(--shadow);
    opacity:0.55;
    transform: translateY(4px);
    transition: transform .15s ease, opacity .15s ease;
    position:relative;
  }
  .tab .count{
    display:block; font-family:Georgia, 'Times New Roman', serif; font-size:0.68rem; font-weight:400; opacity:0.9; margin-top:2px;
  }
  .tab.active{ opacity:1; transform:translateY(0); }
  .tab[data-deck="tenses"]{ background:var(--tab-1); }
  .tab[data-deck="vocab"]{ background:var(--tab-2); }
  .tab[data-deck="phrasal"]{ background:var(--tab-3); }
  .tab[data-deck="irregular"]{ background:var(--tab-4); }
  .tab[data-deck="prepositions"]{ background:var(--tab-5); }
  .tab[data-deck="false_friends"]{ background:var(--tab-6); }
  .tab[data-deck="idioms"]{ background:var(--tab-7); }

  .program-link{
    text-align:center; margin-bottom:12px;
  }
  .program-link button{
    background:none; border:1px solid rgba(34,49,70,0.18); color:var(--ink-soft);
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.78rem;
    padding:6px 14px; border-radius:20px; cursor:pointer;
  }

  .due-banner{
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.85rem; color:var(--ink-soft);
    text-align:center; margin-bottom:14px;
  }

  /* Card */
  .stage{
    position:relative; height:340px; margin: 6px 0 20px 0;
    perspective: 1400px;
  }
  .card{
    position:absolute; inset:0;
    border-radius:6px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.25,1);
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    background:var(--paper);
    box-shadow: var(--shadow);
    border:1px solid rgba(34,49,70,0.08);
    display:flex; flex-direction:column;
    padding:26px 24px;
    background-image:
      linear-gradient(var(--line-blue-soft) 1px, transparent 1px);
    background-size: 100% 26px;
    background-position: 0 46px;
  }
  .face.back{ transform: rotateY(180deg); }
  .face .kicker{
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.72rem; letter-spacing:0.04em;
    text-transform:uppercase; color: var(--ink-soft); opacity:0.7;
    margin-bottom:14px;
  }
  .face .content{
    flex:1; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:1.5rem; line-height:1.35;
    font-weight:600; color:var(--ink);
  }
  .face.back .content{ color: var(--pen-red); font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-weight:400; font-size:1.35rem; }
  .face .example{
    font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:0.95rem;
    color:var(--ink-soft); text-align:center; margin-top:6px;
  }
  .face .hint{
    text-align:center; font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.78rem;
    color:var(--ink-soft); opacity:0.55; margin-top:10px;
  }
  .level-dots{ position:absolute; top:14px; right:16px; display:flex; gap:4px; }
  .level-dots span{ width:6px; height:6px; border-radius:50%; background:var(--line-blue-soft); }
  .level-dots span.on{ background: var(--pen-red-soft); }

  .empty-state{
    height:340px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; gap:10px; color:var(--ink-soft);
  }
  .empty-state .big{ font-family:Snell Roundhand, 'Bradley Hand', 'Segoe Script', cursive; font-size:1.8rem; color:var(--ink); transform:rotate(-1deg); }
  .empty-state button{ margin-top:6px; }

  /* Answer buttons */
  .answers{ display:flex; gap:10px; }
  .answers button{
    flex:1; padding:14px 6px; border-radius:8px; border:none;
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-weight:700; font-size:0.95rem;
    color:#fff; cursor:pointer; box-shadow:var(--shadow);
    transition: transform .1s ease;
  }
  .answers button:active{ transform: scale(0.96); }
  .answers button.again{ background:#A14840; }
  .answers button.good{ background:#4A6FA5; }
  .answers button.easy{ background:#4C7A5E; }
  .answers.hidden{ visibility:hidden; }

  .flip-hint{ text-align:center; font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.85rem; color:var(--ink-soft); margin-top:10px; opacity:0.7; }

  /* FAB + manage */
  .fab{
    position:fixed; right:20px; bottom:20px; z-index:5;
    width:54px; height:54px; border-radius:50%;
    background:var(--pen-red); color:#fff; border:none;
    font-size:1.6rem; box-shadow: var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .manage-link{
    position:fixed; left:20px; bottom:20px; z-index:5;
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.85rem; color:var(--ink-soft);
    background:var(--paper); border:1px solid rgba(34,49,70,0.1);
    padding:10px 14px; border-radius:20px; box-shadow:var(--shadow);
    cursor:pointer;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(34,49,70,0.35); z-index:10;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:520px){ .modal-backdrop{ align-items:center; } }
  .modal{
    background:var(--paper); width:100%; max-width:520px;
    border-radius:16px 16px 0 0; padding:22px 20px 26px 20px;
    max-height:85vh; overflow-y:auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
  }
  @media (min-width:520px){ .modal{ border-radius:16px; } }
  .modal h2{ font-family:Snell Roundhand, 'Bradley Hand', 'Segoe Script', cursive; font-size:1.8rem; margin:0 0 14px 0; color:var(--ink); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.8rem; color:var(--ink-soft); margin-bottom:5px; }
  .field select, .field input, .field textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(34,49,70,0.18);
    font-family:Georgia, 'Times New Roman', serif; font-size:1rem; background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:50px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions button{
    flex:1; padding:12px; border-radius:8px; border:none; font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive;
    font-weight:700; cursor:pointer; font-size:0.95rem;
  }
  .btn-primary{ background:var(--pen-red); color:#fff; }
  .btn-secondary{ background:transparent; color:var(--ink-soft); border:1px solid rgba(34,49,70,0.18) !important; }
  .modal-close{ float:right; background:none; border:none; font-size:1.3rem; color:var(--ink-soft); cursor:pointer; }

  .manage-list{ margin-top:6px; }
  .manage-item{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:10px 0; border-bottom:1px solid rgba(34,49,70,0.08);
  }
  .manage-item .txt{ font-size:0.92rem; }
  .manage-item .txt b{ color:var(--ink); }
  .manage-item .txt span{ display:block; color:var(--ink-soft); font-size:0.85rem; }
  .manage-item button{ background:none; border:none; color:var(--pen-red); font-size:1.1rem; cursor:pointer; padding:4px; }
  .deck-picker{ display:flex; gap:8px; margin-bottom:14px; }
  .deck-picker button{
    flex:1; padding:8px; border-radius:8px; border:1px solid rgba(34,49,70,0.15);
    background:#fff; font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.82rem; cursor:pointer; color:var(--ink-soft);
  }
  .deck-picker button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toast{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:9px 18px; border-radius:20px;
    font-family:'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive; font-size:0.85rem; z-index:20; opacity:0;
    transition:opacity .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:0.95; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="margin-line"></div>

<div class="app">
  <header class="top">
    <h1 class="brand">Mon cahier d'anglais</h1>
    <div class="streak" id="streakLabel"></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-deck="tenses">Concordance<span class="count" id="cnt-tenses"></span></button>
    <button class="tab" data-deck="vocab">Vocabulaire<span class="count" id="cnt-vocab"></span></button>
    <button class="tab" data-deck="phrasal">Phrasal verbs<span class="count" id="cnt-phrasal"></span></button>
    <button class="tab" data-deck="irregular">Verbes irr.<span class="count" id="cnt-irregular"></span></button>
    <button class="tab" data-deck="prepositions">Prépositions<span class="count" id="cnt-prepositions"></span></button>
    <button class="tab" data-deck="false_friends">Faux amis<span class="count" id="cnt-false_friends"></span></button>
    <button class="tab" data-deck="idioms">Idiomes<span class="count" id="cnt-idioms"></span></button>
  </div>

  <div class="program-link"><button id="programBtn">📅 Programme &amp; score</button></div>

  <div class="due-banner" id="dueBanner">Chargement…</div>

  <div id="stageWrap"></div>

  <div class="answers hidden" id="answers">
    <button class="again" id="btnAgain">À revoir</button>
    <button class="good" id="btnGood">Bien</button>
    <button class="easy" id="btnEasy">Facile</button>
  </div>
  <div class="flip-hint" id="flipHint">Touche la carte pour retourner</div>
</div>

<div class="manage-link" id="manageBtn">Gérer les cartes</div>
<div style="position:fixed; right:20px; bottom:82px; z-index:5; font-family:Georgia,serif; font-size:0.68rem; color:rgba(34,49,70,0.35);">v2026-09-05c</div>
<button class="fab" id="addBtn" title="Ajouter une carte">+</button>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function(e){
  try{
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#fff;color:#a00;padding:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;z-index:9999;overflow:auto;';
    box.textContent = 'Erreur : ' + (e.message || 'inconnue') +
      '\nFichier : ' + (e.filename || '?') +
      '\nLigne : ' + (e.lineno || '?') + ':' + (e.colno || '?') +
      (e.error && e.error.stack ? '\n\n' + e.error.stack : '');
    document.body.appendChild(box);
  }catch(_){}
});
(function(){
  const DECKS = {
    tenses: { label:'Concordance des temps' },
    vocab: { label:'Vocabulaire' },
    phrasal: { label:'Phrasal verbs' },
    irregular: { label:'Verbes irréguliers' },
    prepositions: { label:'Prépositions dépendantes' },
    false_friends: { label:'Faux amis' },
    idioms: { label:'Expressions idiomatiques' }
  };

  const SEED = [
    // Concordance des temps — reported speech / sequence of tenses / conditionnels
    {deck:'tenses', front:"Discours direct : « I am tired. »\nStyle indirect : She said (that) she ___ tired.", back:"was", example:"Présent → prétérit quand le verbe introducteur est au passé.", level:0, due:0},
    {deck:'tenses', front:"« I will call you. »\nHe said he ___ call me.", back:"would", example:"will → would", level:0, due:0},
    {deck:'tenses', front:"« I have finished. »\nShe told me she ___ finished.", back:"had", example:"present perfect → past perfect (had + participe passé)", level:0, due:0},
    {deck:'tenses', front:"« I can swim. »\nHe said he ___ swim.", back:"could", example:"can → could", level:0, due:0},
    {deck:'tenses', front:"« I am working. »\nShe said she ___ working.", back:"was", example:"present continuous → past continuous", level:0, due:0},
    {deck:'tenses', front:"« I saw him yesterday. »\nHe said he ___ him the day before.", back:"had seen", example:"prétérit → past perfect ; yesterday → the day before", level:0, due:0},
    {deck:'tenses', front:"« I must leave. »\nShe said she ___ leave.", back:"had to", example:"must → had to", level:0, due:0},
    {deck:'tenses', front:"If + prétérit, ... would + base verbale : quel type de condition ?", back:"Hypothèse peu probable ou irréelle dans le présent/futur (2e conditionnel)", example:"If I had more time, I would travel more.", level:0, due:0},
    {deck:'tenses', front:"If + past perfect, ... would have + participe passé : quel type de condition ?", back:"Regret / irréel dans le passé (3e conditionnel)", example:"If I had known, I would have called you.", level:0, due:0},
    {deck:'tenses', front:"« Where do you live? »\nHe asked me where ___.", back:"I lived", example:"Question indirecte : pas d'inversion, present → past", level:0, due:0},
    {deck:'tenses', front:"Le prétérit exprime une action... (2 caractéristiques)", back:"Terminée, à un moment précis et révolu du passé", example:"I visited Paris in 2019.", level:0, due:0},
    {deck:'tenses', front:"Le present perfect exprime une action...", back:"Passée mais liée au présent, ou sans moment précisé", example:"I have visited Paris three times.", level:0, due:0},
    {deck:'tenses', front:"If + présent, ... will + base verbale : quel type de condition ?", back:"Hypothèse réaliste dans le futur (1er conditionnel)", example:"If it rains, I will stay home.", level:0, due:0},
    {deck:'tenses', front:"« Are you coming? »\nHe asked if ___.", back:"I was coming", example:"Question fermée en style indirect : if/whether + sujet + verbe", level:0, due:0},
    {deck:'tenses', front:"« Don't touch that! »\nHe told me ___ touch it.", back:"not to", example:"Impératif négatif → to + BV devient not to + BV", level:0, due:0},
    {deck:'tenses', front:"« Close the door. »\nShe told him ___ the door.", back:"to close", example:"Impératif → to + base verbale en discours indirect", level:0, due:0},
    {deck:'tenses', front:"« I went there last week. »\nHe said he ___ there the week before.", back:"had gone", example:"prétérit → past perfect ; last week → the week before", level:0, due:0},
    {deck:'tenses', front:"« Tomorrow » devient ___ en discours indirect (si rapporté un autre jour).", back:"the next day / the following day", example:"He said he would call the next day.", level:0, due:0},
    {deck:'tenses', front:"« Now » devient ___ en discours indirect.", back:"then / at that time", example:"She said she was busy then.", level:0, due:0},
    {deck:'tenses', front:"« Here » devient souvent ___ en discours indirect.", back:"there", example:"He said he would wait there.", level:0, due:0},
    {deck:'tenses', front:"« This » devient souvent ___ en discours indirect.", back:"that", example:"She said that book was hers.", level:0, due:0},
    {deck:'tenses', front:"Quand utilise-t-on le past perfect continuous ?", back:"Pour une action en cours avant un autre moment du passé", example:"I had been working for two hours when she called.", level:0, due:0},
    {deck:'tenses', front:"« I might come. »\nHe said he ___ come.", back:"might", example:"might reste might (ne change pas) en concordance des temps", level:0, due:0},
    {deck:'tenses', front:"« I should call her. »\nHe said he ___ call her.", back:"should", example:"should reste should en concordance des temps", level:0, due:0},
    {deck:'tenses', front:"Quelle structure pour un fait toujours vrai en discours indirect ?", back:"On peut garder le présent même si le verbe introducteur est au passé", example:"She said the Earth is round.", level:0, due:0},
    {deck:'tenses', front:"« I've been waiting for an hour. »\nHe said he ___ waiting for an hour.", back:"had been", example:"present perfect continuous → past perfect continuous", level:0, due:0},
    {deck:'tenses', front:"Différence entre 'since' et 'for' avec le present perfect ?", back:"since + point de départ, for + durée", example:"since 2020 / for three years", level:0, due:0},
    {deck:'tenses', front:"« I'm going to visit her. »\nHe said he ___ going to visit her.", back:"was", example:"be going to au présent → was/were going to", level:0, due:0},
    {deck:'tenses', front:"Le futur simple 'will' devient ___ dans un récit au passé (non-discours rapporté).", back:"would (futur dans le passé)", example:"He knew she would arrive soon.", level:0, due:0},
    {deck:'tenses', front:"Quand n'applique-t-on PAS le backshift (recul des temps) ?", back:"Quand le verbe introducteur est au présent, ou pour une vérité générale", example:"She says she is tired. / He said water boils at 100°C.", level:0, due:0},
    {deck:'tenses', front:"« Yesterday » devient ___ en discours indirect.", back:"the day before / the previous day", example:"He said he had called the day before.", level:0, due:0},
    {deck:'tenses', front:"Quelle est la structure du 3e conditionnel mixte (regret passé, conséquence présente) ?", back:"If + past perfect, ... would + base verbale", example:"If I had studied medicine, I would be a doctor now.", level:0, due:0},
    {deck:'tenses', front:"« I'll have finished by 6pm. »\nHe said he ___ finished by 6pm.", back:"would have", example:"future perfect → would have + participe passé", level:0, due:0},
    {deck:'tenses', front:"Structure du zéro conditionnel (vérité générale) ?", back:"If + présent, ... présent", example:"If you heat ice, it melts.", level:0, due:0},
    {deck:'tenses', front:"« Next month » devient ___ en discours indirect.", back:"the following month", example:"She said she would travel the following month.", level:0, due:0},
    {deck:'tenses', front:"Pourquoi dit-on 'I wish I knew' et non 'I wish I know' ?", back:"Après 'I wish' pour un regret présent, on utilise le prétérit modal", example:"I wish I knew the answer.", level:0, due:0},

    // Vocabulaire
    {deck:'vocab', front:"achever, mener à bien", back:"to accomplish", example:"She accomplished her goal.", level:0, due:0},
    {deck:'vocab', front:"davantage, en outre", back:"furthermore", example:"Furthermore, the results were significant.", level:0, due:0},
    {deck:'vocab', front:"malgré", back:"despite / in spite of", example:"Despite the rain, we went out.", level:0, due:0},
    {deck:'vocab', front:"faire face à, affronter", back:"to face / to cope with", example:"She had to cope with a lot of stress.", level:0, due:0},
    {deck:'vocab', front:"un défi", back:"a challenge", example:"It was a real challenge.", level:0, due:0},
    {deck:'vocab', front:"souligner, insister sur", back:"to emphasize / to highlight", example:"He emphasized the importance of practice.", level:0, due:0},
    {deck:'vocab', front:"un aperçu", back:"an overview / an insight", example:"This gives a good overview of the topic.", level:0, due:0},
    {deck:'vocab', front:"répandu, courant", back:"widespread / common", example:"This is a widespread problem.", level:0, due:0},
    {deck:'vocab', front:"une lacune, un manque", back:"a gap / a shortage", example:"There's a gap in the market.", level:0, due:0},

  const INTERVALS_DAYS = [1, 2, 4, 7, 15, 30, 60];
  const STORAGE_KEY = 'cards-v1';
  const STREAK_KEY = 'streak-v1';

  let cards = [];
  let currentDeck = 'tenses';
  let queue = [];
  let currentCard = null;
  let flipped = false;
  let streak = { count:0, lastDay:null };

  const el = id => document.getElementById(id);
  const now = () => Date.now();
  const dayMs = 86400000;

  const PROGRAM_DAYS = 182; // ~6 months
  let programStart = null;
  let introToday = { date:null, perDeck:{} };

  function uid(){ return 'c' + Math.random().toString(36).slice(2,10); }
  function cardKey(c){ return c.deck + '|' + c.front; }

  async function loadCards(){
    let existing = [];
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) existing = JSON.parse(raw);
    } catch(e){ existing = []; }

    if(existing.length === 0){
      // Very first launch: introduce today's first batch, rest queued as "new"
      cards = SEED.map(c => ({...c, id: uid(), introduced:false, due:null}));
    } else {
      // Migration: the format of 'phrasal' and 'prepositions' cards changed to
      // fill-in-the-blank. Drop old-format cards from those decks that were never
      // reviewed (no progress lost); keep any already introduced (real progress).
      const reformattedDecks = new Set(['phrasal','prepositions']);
      const newKeysByDeck = {};
      SEED.forEach(c=>{
        if(!newKeysByDeck[c.deck]) newKeysByDeck[c.deck] = new Set();
        newKeysByDeck[c.deck].add(cardKey(c));
      });
      existing = existing.filter(c=>{
        if(!reformattedDecks.has(c.deck)) return true;
        const stillValid = newKeysByDeck[c.deck] && newKeysByDeck[c.deck].has(cardKey(c));
        return stillValid || c.introduced;
      });

      // Merge: keep existing progress, append any SEED cards not already present
      const seen = new Set(existing.map(cardKey));
      const toAdd = SEED.filter(c => !seen.has(cardKey(c)))
                         .map(c => ({...c, id: uid(), introduced:false, due:null}));
      cards = existing.concat(toAdd);
    }
    await saveCards();
  }

  async function saveCards(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }
    catch(e){ console.error('save failed', e); }
  }

  async function loadStreak(){
    try{
      const raw = localStorage.getItem(STREAK_KEY);
      if(raw){ streak = JSON.parse(raw); }
    } catch(e){}
    renderStreak();
  }
  async function saveStreak(){
    try{ localStorage.setItem(STREAK_KEY, JSON.stringify(streak)); }catch(e){}
  }
  function bumpStreak(){
    const today = new Date().toDateString();
    if(streak.lastDay === today) return;
    const yesterday = new Date(Date.now()-dayMs).toDateString();
    streak.count = (streak.lastDay === yesterday) ? streak.count+1 : 1;
    streak.lastDay = today;
    saveStreak();
    renderStreak();
  }
  function renderStreak(){
    el('streakLabel').textContent = streak.count > 0 ? `🔥 ${streak.count} j.` : '';
  }

  async function loadProgram(){
    try{
      let raw = localStorage.getItem('program-start-v1');
      if(!raw){ raw = String(now()); localStorage.setItem('program-start-v1', raw); }
      programStart = parseInt(raw, 10);
    } catch(e){ programStart = now(); }
    try{
      const raw2 = localStorage.getItem('intro-today-v1');
      introToday = raw2 ? JSON.parse(raw2) : { date:null, perDeck:{}, reviews:0 };
      if(!introToday.perDeck) introToday.perDeck = {};
      if(typeof introToday.reviews !== 'number') introToday.reviews = 0;
    } catch(e){ introToday = { date:null, perDeck:{}, reviews:0 }; }
    const today = new Date().toDateString();
    if(introToday.date !== today){ introToday = { date:today, perDeck:{}, reviews:0 }; saveIntroToday(); }
    // Default pace: 10 new cards per theme per day (user-requested)
    try{
      if(getCustomPerDeck() === null){ setCustomPerDeck(10); }
    } catch(e){}
  }
  function saveIntroToday(){
    try{ localStorage.setItem('intro-today-v1', JSON.stringify(introToday)); }catch(e){}
  }

  function programDaysElapsed(){ return Math.max(1, Math.floor((now()-programStart)/dayMs)+1); }
  function programDaysLeft(){ return Math.max(1, PROGRAM_DAYS - programDaysElapsed() + 1); }
  function getCustomPerDeck(){
    try{
      const raw = localStorage.getItem('custom-per-deck-v1');
      return raw ? parseInt(raw, 10) : null;
    } catch(e){ return null; }
  }
  function setCustomPerDeck(n){
    try{
      if(n === null){ localStorage.removeItem('custom-per-deck-v1'); }
      else { localStorage.setItem('custom-per-deck-v1', String(n)); }
    } catch(e){}
  }
  function autoDeckBudget(deck){
    const remaining = deckCards(deck).filter(c=>!c.introduced).length;
    return Math.max(1, Math.ceil(remaining / programDaysLeft()));
  }
  function perDeckDailyBudget(deck){
    const custom = getCustomPerDeck();
    if(custom !== null) return Math.max(1, custom);
    return autoDeckBudget(deck);
  }
  function todayIntroCountFor(deck){ return introToday.perDeck[deck] || 0; }
  function todayIntroRemaining(deck){
    return Math.max(0, perDeckDailyBudget(deck) - todayIntroCountFor(deck));
  }
  function todayIntroTotalDone(){
    return Object.values(introToday.perDeck).reduce((a,b)=>a+b, 0);
  }
  function masteredCount(){ return cards.filter(c=>c.introduced && (c.level||0) >= 4).length; }

  function deckCards(deck){ return cards.filter(c=>c.deck===deck); }
  function dueCards(deck){ return deckCards(deck).filter(c => c.introduced && c.due <= now()); }
  function newCards(deck){ return deckCards(deck).filter(c => !c.introduced); }

  function renderCounts(){
    Object.keys(DECKS).forEach(d=>{
      const dueCount = dueCards(d).length;
      const freshAvailable = Math.min(newCards(d).length, todayIntroRemaining(d));
      const total = dueCount + freshAvailable;
      el('cnt-' + d).textContent = total + ' à revoir';
    });
  }

  function buildQueue(){
    const due = dueCards(currentDeck).sort((a,b)=>a.due-b.due);
    const budget = todayIntroRemaining(currentDeck);
    const fresh = newCards(currentDeck).slice(0, budget);
    queue = due.concat(fresh);
  }

  function showToast(msg){
    const t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1600);
  }

  function renderStage(){
    const wrap = el('stageWrap');
    buildQueue();
    renderCounts();

    if(queue.length === 0){
      currentCard = null;
      el('answers').classList.add('hidden');
      el('flipHint').style.visibility = 'hidden';
      const total = deckCards(currentDeck).length;
      const remainingNew = newCards(currentDeck).length;
      let big, small;
      if(total === 0){
        big = "Ce paquet est vide"; small = "Ajoute ta première carte.";
      } else if(remainingNew > 0){
        big = "Quota du jour atteint ✓"; small = `${remainingNew} nouvelle${remainingNew>1?'s':''} carte${remainingNew>1?'s':''} en attente pour demain.`;
      } else {
        big = "Tout est révisé ✓"; small = "Reviens plus tard pour la suite.";
      }
      wrap.innerHTML = `<div class="empty-state">
        <div class="big">${big}</div>
        <div>${small}</div>
      </div>`;
      el('dueBanner').textContent = DECKS[currentDeck].label;
      return;
    }

    currentCard = queue[0];
    flipped = false;
    el('dueBanner').textContent = `${DECKS[currentDeck].label} — ${queue.length} carte${queue.length>1?'s':''} à revoir`;
    el('flipHint').style.visibility = 'visible';
    el('answers').classList.add('hidden');

    const level = currentCard.level || 0;
    const dots = Array.from({length:5}, (_,i)=>`<span class="${i<level?'on':''}"></span>`).join('');

    wrap.innerHTML = `
      <div class="stage">
        <div class="card" id="cardEl">
          <div class="face front">
            <div class="kicker">${DECKS[currentDeck].label}</div>
            <div class="level-dots">${dots}</div>
            <div class="content">${escapeHtml(currentCard.front).replace(/\n/g,'<br>')}</div>
          </div>
          <div class="face back">
            <div class="kicker">Réponse</div>
            <div class="content">${escapeHtml(currentCard.back)}</div>
            ${currentCard.example ? `<div class="example">${escapeHtml(currentCard.example)}</div>` : ''}
          </div>
        </div>
      </div>
    `;
    el('cardEl').addEventListener('click', flipCard);
  }

  function flipCard(){
    if(!currentCard) return;
    flipped = !flipped;
    el('cardEl').classList.toggle('flipped', flipped);
    if(flipped){
      el('answers').classList.remove('hidden');
      el('flipHint').style.visibility = 'hidden';
    } else {
      el('answers').classList.add('hidden');
      el('flipHint').style.visibility = 'visible';
    }
  }

  function grade(result){
    if(!currentCard) return;
    if(!currentCard.introduced){
      currentCard.introduced = true;
      introToday.perDeck[currentCard.deck] = (introToday.perDeck[currentCard.deck] || 0) + 1;
    } else {
      introToday.reviews = (introToday.reviews || 0) + 1;
    }
    saveIntroToday();
    let level = currentCard.level || 0;
    if(result === 'again'){
      level = 0;
      currentCard.level = level;
      currentCard.due = now() + 3*60*1000; // resurfaces in ~3 minutes, same session
      saveCards();
      bumpStreak();
      renderStage();
      return;
    }
    else if(result === 'good'){ level = Math.min(level+1, INTERVALS_DAYS.length-1); }
    else if(result === 'easy'){ level = Math.min(level+2, INTERVALS_DAYS.length-1); }
    currentCard.level = level;
    const days = INTERVALS_DAYS[level];
    currentCard.due = now() + days*dayMs;
    saveCards();
    bumpStreak();
    renderStage();
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Tabs
  el('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    currentDeck = btn.dataset.deck;
    renderStage();
  });

  // Answer buttons
  el('btnAgain').addEventListener('click', ()=>grade('again'));
  el('btnGood').addEventListener('click', ()=>grade('good'));
  el('btnEasy').addEventListener('click', ()=>grade('easy'));

    const root = el('modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <button class="modal-close" id="closeModal">✕</button>
          <h2>Nouvelle carte</h2>

            ${Object.keys(DECKS).map(d=>`<button data-d="${d}" class="${d===prefillDeck?'active':''}">${DECKS[d].label}</button>`).join('')}
          </div>
          <div class="field">
            <label>Recto (question)</label>
            <textarea id="fFront" placeholder="ex : deal with"></textarea>
          </div>

            <textarea id="fBack" placeholder="ex : gérer, s'occuper de"></textarea>

            <input id="fExample" placeholder="ex : I need to deal with this.">

            <button class="btn-secondary" id="cancelAdd">Annuler</button>
            <button class="btn-primary" id="saveAdd">Ajouter</button>
          </div>
        </div>
      </div>
    `;
    let selectedDeck = prefillDeck;

      b.addEventListener('click', ()=>{
        root.querySelectorAll('#deckPicker button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');

      });
    });
    el('closeModal').addEventListener('click', closeModal);
    el('cancelAdd').addEventListener('click', closeModal);
    el('backdrop').addEventListener('click', (e)=>{ if(e.target.id==='backdrop') closeModal(); });
    el('saveAdd').addEventListener('click', async ()=>{
      const front = el('fFront').value.trim();
      const back = el('fBack').value.trim();
      const example = el('fExample').value.trim();
      if(!front || !back){ showToast('Recto et verso requis'); return; }
      cards.push({ id: uid(), deck: selectedDeck, front, back, example, level:0, due: now(), introduced:true });
      await saveCards();
      closeModal();
      showToast('Carte ajoutée');
      Object.keys(DECKS).forEach(d=>{
        document.querySelector(`.tab[data-deck="${d}"]`).classList.toggle('active', d===selectedDeck);
      });
      currentDeck = selectedDeck;
      renderStage();
    });
  }
  function closeModal(){ el('modalRoot').innerHTML = ''; }
  el('addBtn').addEventListener('click', ()=>openAddModal(currentDeck));

  // Manage modal
  function openManageModal(){
    const root = el('modalRoot');
    function listHtml(){
      return Object.keys(DECKS).map(d=>{
        const items = deckCards(d);
        if(items.length===0) return '';
        return `<div style="margin-bottom:10px;">
          <div class="field"><label>${DECKS[d].label} (${items.length})</label></div>
          ${items.map(c=>`
            <div class="manage-item" data-id="${c.id}">
              <div class="txt"><b>${escapeHtml(c.front)}</b><span>${escapeHtml(c.back)}</span></div>
              <button class="del-btn" data-id="${c.id}">🗑</button>
            </div>
          `).join('')}
        </div>`;
      }).join('') || '<p style="color:var(--ink-soft)">Aucune carte pour le moment.</p>';
    }
    root.innerHTML = `
      <div class="modal-backdrop" id="backdrop2">
        <div class="modal">
          <button class="modal-close" id="closeModal2">✕</button>
          <h2>Gérer les cartes</h2>
          <div class="manage-list" id="manageList">${listHtml()}</div>
        </div>
      </div>
    `;
    el('closeModal2').addEventListener('click', closeModal);
    el('backdrop2').addEventListener('click', (e)=>{ if(e.target.id==='backdrop2') closeModal(); });
    function bindDeleteButtons(){
      root.querySelectorAll('.del-btn').forEach(b=>{
        b.addEventListener('click', async ()=>{
          const id = b.dataset.id;
          cards = cards.filter(c=>c.id!==id);
          await saveCards();
          el('manageList').innerHTML = listHtml();
          bindDeleteButtons();
          renderStage();
        });
      });
    }
    bindDeleteButtons();
  }
  el('manageBtn').addEventListener('click', openManageModal);

  const DECK_COLORS = {
    tenses:'#C4544A', vocab:'#4C7A5E', phrasal:'#4A6FA5',
    irregular:'#B8863B', prepositions:'#3F8F86', false_friends:'#7A5C8E', idioms:'#A54B70'
  };

  // Approximate CEFR difficulty tier per theme (1=B1 .. 5=C1) — indicative, not certified
  const DECK_CEFR = {
    irregular: 1,       // B1 — base vocabulaire grammatical
    prepositions: 2,    // B1+
    vocab: 3,           // B2
    phrasal: 3,         // B2
    tenses: 3,          // B2 (avec nuances C1)
    false_friends: 4,   // B2+
    idioms: 5           // C1
  };
  const CEFR_LABELS = ['B1','B1+','B2','B2+','C1'];

  function cefrEstimate(){
    // Weighted mastery: mastering higher-tier decks pulls the estimate further toward C1.
    let maxWeighted = 0, curWeighted = 0;
    Object.keys(DECKS).forEach(d=>{
      const tier = DECK_CEFR[d] || 3;
      const total = deckCards(d).length;
      const mastered = deckCards(d).filter(c=>c.introduced && (c.level||0)>=4).length;
      maxWeighted += tier * total;
      curWeighted += tier * mastered;
    });
    const ratio = maxWeighted > 0 ? (curWeighted / maxWeighted) : 0;
    // Start baseline at B1+ (index 1), progress toward C1 (index 4) as ratio grows.
    const numeric = 1 + 3 * Math.min(1, ratio); // 1..4 → maps to CEFR_LABELS index 1..4
    const idx = Math.max(0, Math.min(4, Math.round(numeric)));
    return { idx, ratio, label: CEFR_LABELS[idx] };
  }

  // Programme modal
  function openProgramModal(){
    const root = el('modalRoot');
    const totalCards = cards.length;
    const introduced = cards.filter(c=>c.introduced).length;
    const mastered = masteredCount();
    const cefr = cefrEstimate();
    const daysElapsed = programDaysElapsed();
    const daysLeft = programDaysLeft();
    const perDeckBudget = perDeckDailyBudget('tenses'); // representative display value
    const isCustom = getCustomPerDeck() !== null;
    const doneTodayNew = todayIntroTotalDone();
    const doneTodayReviews = introToday.reviews || 0;
    const pct = totalCards ? Math.round((introduced/totalCards)*100) : 0;
    const masteredPct = totalCards ? Math.round((mastered/totalCards)*100) : 0;

    const deckRows = Object.keys(DECKS).map(d=>{
      const t = deckCards(d).length;
      const i = deckCards(d).filter(c=>c.introduced).length;
      const due = dueCards(d).length;
      const budget = perDeckDailyBudget(d);
      const doneD = todayIntroCountFor(d);
      const dp = t ? Math.round((i/t)*100) : 0;
      const color = DECK_COLORS[d];
      return `
        <div style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:3px;">
            <b style="color:var(--ink);">${DECKS[d].label}</b>
            <span style="color:var(--ink-soft);">${i}/${t}${due>0 ? ` · ${due} à revoir` : ''}</span>
          </div>
          <div style="background:#fff;border:1px solid rgba(34,49,70,0.15);border-radius:6px;height:10px;overflow:hidden;">
            <div style="width:${dp}%;background:${color};height:100%;"></div>
          </div>
          <div style="font-size:0.76rem;color:var(--ink-soft);margin-top:2px;">Aujourd'hui : ${doneD}/${budget} nouvelles</div>
        </div>`;
    }).join('');

    root.innerHTML = `
      <div class="modal-backdrop" id="backdropP">
        <div class="modal">
          <button class="modal-close" id="closeModalP">✕</button>
          <h2>Programme &amp; score</h2>
          <p style="color:var(--ink-soft); font-size:0.92rem; margin-top:-6px;">
            Jour ${daysElapsed} sur ~${PROGRAM_DAYS} (${daysLeft} jours restants) ${streak.count>0 ? `· 🔥 ${streak.count} j.` : ''}
          </p>

          <div style="display:flex; gap:10px; margin:14px 0;">
            <div style="flex:1; background:#fff; border:1px solid rgba(34,49,70,0.12); border-radius:10px; padding:12px; text-align:center;">
              <div style="font-family:'Caveat',cursive; font-size:1rem; font-weight:400; color:var(--ink-soft);">Aujourd'hui</div>
              <div style="font-size:1.4rem; font-weight:700; color:var(--pen-red);">${doneTodayNew + doneTodayReviews}</div>
              <div style="font-size:0.72rem; color:var(--ink-soft);">${doneTodayNew} nouvelles · ${doneTodayReviews} révisions</div>
            </div>
            <div style="flex:1; background:#fff; border:1px solid rgba(34,49,70,0.12); border-radius:10px; padding:12px; text-align:center;">
              <div style="font-family:'Caveat',cursive; font-size:1rem; font-weight:400; color:var(--ink-soft);">Maîtrisées</div>
              <div style="font-size:1.4rem; font-weight:700; color:var(--pen-green, #4C7A5E);">${mastered}</div>
              <div style="font-size:0.72rem; color:var(--ink-soft);">${masteredPct}% du total</div>
            </div>
          </div>

          <div class="field">
            <label>Niveau estimé (indicatif — pas un test certifié)</label>
            <div style="position:relative; height:34px; margin-top:8px;">
              <div style="position:absolute; top:14px; left:0; right:0; height:6px; border-radius:3px; background:linear-gradient(90deg, #C4544A, #B8863B, #4C7A5E, #3F8F86, #A54B70);"></div>
              <div style="position:absolute; top:0; left:${cefr.idx*25}%; transform:translateX(-50%); text-align:center;">
                <div style="font-size:1.3rem; line-height:1;">📍</div>
              </div>
              <div style="position:absolute; top:0; left:100%; transform:translateX(-100%); text-align:center;">
                <div style="font-size:0.9rem;">🎯</div>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:var(--ink-soft); margin-top:2px;">
              ${CEFR_LABELS.map(l=>`<span>${l}</span>`).join('')}
            </div>
            <div style="font-size:0.85rem; margin-top:8px;">Position actuelle : <b>${cefr.label}</b> — objectif : <b>C1</b> (B2+ minimum visé)</div>
          </div>

          <div class="field">
            <label>Progression globale — ${introduced} / ${totalCards} cartes découvertes (${pct}%)</label>
            <div style="background:#fff;border:1px solid rgba(34,49,70,0.15);border-radius:8px;height:14px;overflow:hidden;">
              <div style="width:${pct}%;background:var(--pen-red);height:100%;"></div>
            </div>
          </div>

          <div class="field">
            <label>Cartes neuves par thème et par jour ${isCustom ? '(réglage manuel)' : '(calcul automatique)'}</label>
            <div style="display:flex; gap:8px; align-items:center;">
              <input type="number" id="perDayInput" min="1" max="200" value="${perDeckBudget}" style="width:90px; padding:8px 10px; border-radius:8px; border:1px solid rgba(34,49,70,0.18); font-family:Georgia,serif;">
              <button class="btn-primary" id="savePerDay" style="flex:0 0 auto; padding:9px 14px; border-radius:8px; border:none; font-family:'Marker Felt','Segoe Print','Comic Sans MS',cursive; cursor:pointer;">Valider</button>
            </div>
            <div style="font-size:0.82rem;color:var(--ink-soft);margin-top:6px;">${isCustom ? `Rythme fixé manuellement — <a href="#" id="resetPerDay" style="color:var(--pen-red);">revenir au calcul automatique</a>` : "S'ajuste chaque jour selon ce qu'il reste à découvrir."}</div>
          </div>

          <div class="field">
            <label>Détail par thème</label>
            ${deckRows}
          </div>
        </div>
      </div>
    `;
    el('closeModalP').addEventListener('click', closeModal);
    el('backdropP').addEventListener('click', (e)=>{ if(e.target.id==='backdropP') closeModal(); });
    el('savePerDay').addEventListener('click', ()=>{
      const v = parseInt(el('perDayInput').value, 10);
      if(!v || v < 1){ showToast('Entre un nombre valide'); return; }
      setCustomPerDeck(v);
      showToast(`Rythme fixé à ${v} carte${v>1?'s':''}/thème/jour`);
      closeModal();
      renderStage();
    });
    const resetLink = el('resetPerDay');
    if(resetLink){
      resetLink.addEventListener('click', (e)=>{
        e.preventDefault();
        setCustomPerDeck(null);
        showToast('Rythme automatique rétabli');
        closeModal();
        renderStage();
      });
    }
  }
  el('programBtn').addEventListener('click', openProgramModal);

  // Init
  (async function init(){
    el('dueBanner').textContent = 'Chargement…';
    await loadCards();
    await loadStreak();
    await loadProgram();
    renderStage();
  })();
})();
</script>
</body>
</html>
